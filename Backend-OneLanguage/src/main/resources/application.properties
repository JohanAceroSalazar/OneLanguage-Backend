spring.application.name=Backend-OneLanguage
server.port=${SERVER_PORT:8084}

# --- Database Connection ---
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5438/proyect_onelanguage}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Johan2509}

# Driver
spring.datasource.driver-class-name=org.postgresql.Driver

# --- Hibernate JPA ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# JWT Configuration
jwt.secret=3dc0db5ab0d89f8b7718efee3c0db5ab0d89f8b7718efee3c0db5ab0d89f8b
jwt.expiration=86400000

# CONFIGURACIÓN DE CORREO - GMAIL

spring.mail.host=smtp.gmail.com
spring.mail.port=587

# Correo de Gmail que enviará los mensajes
spring.mail.username=${MAIL_USERNAME}

# Contraseña de aplicación generada por Google
spring.mail.password=${MAIL_PASSWORD}

# Configuración SMTP
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true