spring.application.name=Backend-OneLanguage
server.port=${SERVER_PORT:8084}

# --- Database Connection ---
spring.datasource.url=${SPRING_DATASOURCE_URL:***REMOVED***}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:***REMOVED***}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:***REMOVED***}

# Driver
spring.datasource.driver-class-name=org.***REMOVED***ql.Driver

# --- Hibernate JPA ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# JWT Configuration
jwt.secret=***REMOVED***
jwt.expiration=86400000