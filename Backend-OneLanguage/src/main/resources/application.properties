spring.application.name=Backend-OneLanguage
server.port=${SERVER_PORT:8084}
server.address=0.0.0.0

# Comma-separated web origins. Override CORS_ALLOWED_ORIGINS per deployment.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://10.3.233.166:5173}

# --- Database Connection ---
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Driver
spring.datasource.driver-class-name=org.postgresql.Driver

# --- Hibernate JPA ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# CONFIGURACIÓN DE CORREO - GMAIL

spring.mail.host=smtp.gmail.com
spring.mail.port=587

# Correo de Gmail que enviará los mensajes
spring.mail.username=${MAIL_USERNAME}

# Contraseña de aplicación generada por Google
spring.mail.password=${MAIL_PASSWORD}

# Configuración SMTP
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
