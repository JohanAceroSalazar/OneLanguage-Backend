name: Backend CI
on:
  pull_request:
    branches: [dev, qa, main]
  push:
    branches: [dev, qa, main, "HU-**"]
permissions:
  contents: read
jobs:
  compose-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - env:
          SPRING_DATASOURCE_URL: jdbc:***REMOVED***ql://***REMOVED***:5432/***REMOVED***
          SPRING_DATASOURCE_USERNAME: ***REMOVED***
          SPRING_DATASOURCE_PASSWORD: ***REMOVED***
          JWT_SECRET: ***REMOVED***
          MAIL_USERNAME: ci_mail_user
          MAIL_PASSWORD: ***REMOVED***
        run: docker compose --env-file /dev/null config --quiet
  test:
    runs-on: ubuntu-latest
    needs: compose-validation
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - working-directory: Backend-OneLanguage
        env:
          JWT_SECRET: ***REMOVED***
          MAIL_USERNAME: ci_mail_user
          MAIL_PASSWORD: ***REMOVED***
        run: ./mvnw verify
